# UTA iOS Build (Ad Hoc IPA) - GitHub Actions
# Secrets required:
#   APPLE_TEAM_ID
#   BUNDLE_ID
#   IOS_P12_B64
#   IOS_MOBILEPROVISION_B64
#   P12_PASSWORD

name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uta-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_P12_B64: ${{ secrets.IOS_P12_B64 }}
      IOS_MOBILEPROVISION_B64: ${{ secrets.IOS_MOBILEPROVISION_B64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight - ensure required secrets exist
        shell: bash
        run: |
          set -euo pipefail
          need=(BUNDLE_ID APPLE_TEAM_ID IOS_P12_B64 IOS_MOBILEPROVISION_B64 P12_PASSWORD)
          for k in "${need[@]}"; do
            v="${!k:-}"
            if [ -z "$v" ]; then
              echo "::error::Missing required secret/env: $k"
              exit 1
            fi
          done

          echo "Secret lengths (chars):"
          echo "  IOS_P12_B64=${#IOS_P12_B64}"
          echo "  IOS_MOBILEPROVISION_B64=${#IOS_MOBILEPROVISION_B64}"
          echo "  P12_PASSWORD=${#P12_PASSWORD}"
          echo "  BUNDLE_ID=${#BUNDLE_ID}"
          echo "  APPLE_TEAM_ID=${#APPLE_TEAM_ID}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: "stable"
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Ensure iOS location permission text
        shell: bash
        run: |
          set -euo pipefail
          PLIST="ios/Runner/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::Missing $PLIST"
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string UTA uses your location to show your live position, detect route checkpoints, and recalculate travel ETAs while you are using the app." "$PLIST"
          fi

      - name: Prepare Flutter iOS build
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign

      - name: Decode signing assets and install keychain
        shell: bash
        run: |
          set -euo pipefail

          printf "%s" "$IOS_P12_B64" | tr -d '[:space:]' | base64 --decode > cert.p12
          printf "%s" "$IOS_MOBILEPROVISION_B64" | tr -d '[:space:]' | base64 --decode > profile.mobileprovision

          echo "Decoded file sizes:"
          ls -l cert.p12 profile.mobileprovision
          shasum -a 256 cert.p12 profile.mobileprovision

          security cms -D -i profile.mobileprovision > profile.plist
          PP_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)"
          PP_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)"
          APP_ID_FROM_PROFILE="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist)"
          BUNDLE_ID_FROM_PROFILE="${APP_ID_FROM_PROFILE#*.}"

          echo "Profile Name: $PP_NAME"
          echo "Profile UUID: $PP_UUID"
          echo "Profile app-id: $APP_ID_FROM_PROFILE"
          echo "Profile bundle id: $BUNDLE_ID_FROM_PROFILE"
          echo "Expected bundle id: $BUNDLE_ID"

          if [ "$BUNDLE_ID_FROM_PROFILE" != "$BUNDLE_ID" ]; then
            echo "::error::Provisioning profile bundle id '$BUNDLE_ID_FROM_PROFILE' does not match BUNDLE_ID secret '$BUNDLE_ID'"
            exit 1
          fi

          openssl pkcs12 -in cert.p12 -info -noout -passin pass:"$P12_PASSWORD"

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          openssl pkcs12 -in cert.p12 -passin pass:"$P12_PASSWORD" -nodes -out cert.pem
          openssl pkcs12 -export -in cert.pem -out cert_legacy.p12 -passout pass:"$P12_PASSWORD" -macalg sha1
          security import cert_legacy.p12 -k build.keychain -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"

          echo "PP_UUID=$PP_UUID" >> "$GITHUB_ENV"
          echo "PP_NAME=$PP_NAME" >> "$GITHUB_ENV"
          echo "APP_ID_FROM_PROFILE=$APP_ID_FROM_PROFILE" >> "$GITHUB_ENV"

      - name: Debug signing identities
        shell: bash
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning build.keychain || true
          echo "Provisioning profile name: ${PP_NAME:-}"
          echo "Provisioning profile uuid: ${PP_UUID:-}"
          echo "Profile app-id: ${APP_ID_FROM_PROFILE:-}"
          echo "Expected bundle id: ${BUNDLE_ID:-}"

      - name: Archive unsigned
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

      - name: Export IPA Ad Hoc
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          bundle_id = os.environ["BUNDLE_ID"]
          team_id = os.environ["APPLE_TEAM_ID"]
          profile_name = os.environ["PP_NAME"]
          runner_temp = os.environ["RUNNER_TEMP"]

          plist = f'''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>{team_id}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>{bundle_id}</key>
              <string>{profile_name}</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          '''
          out = Path(runner_temp) / "ExportOptions.plist"
          out.write_text(plist, encoding="utf-8")
          print(f"Wrote {out}")
          PY

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: uta-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
